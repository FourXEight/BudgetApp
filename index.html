<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#d4a928">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="budgetpro-192.png">
<link rel="apple-touch-icon" href="budgetpro-192.png"><title>BUDGET — 8-bit alpha</title>
<style>
:root{--bg:#123b68;--paper:#f3dca8;--paper2:#e7c88a;--ink:#241b12;--green:#176638;--green2:#25823c;--red:#97271f;--red2:#b73529;--gold:#d9b570}
*{box-sizing:border-box}body{margin:0;background:#d4a928;color:#fff0cc;font-family:ui-monospace,"Courier New",monospace;padding:12px}button,input,select{font:inherit}button{cursor:pointer}.app{width:min(100%,760px);margin:auto}.title{pointer-events:none;user-select:none;-webkit-user-select:none;text-align:center;width:100%;height:clamp(58px,15vw,108px);margin:0 0 15px;position:relative;z-index:0;transform:translateY(5px)}.wave-mark{display:block;width:100%;height:100%;overflow:visible}
.settings{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;background:#292d2d;border:3px solid #66645a;padding:12px;margin-bottom:14px}.settings label{display:block;color:#f3dca8;font-size:11px;font-weight:1000;margin-bottom:6px}.settings select,.settings input{width:100%;padding:10px;background:var(--paper);color:var(--ink);border:3px solid #bca16d;border-radius:0;font-weight:bold}.cycleline{grid-column:1/-1;text-align:center;font-size:11px;color:#d9b570;line-height:1.5}
.totalBox{background:var(--paper);color:var(--ink);border:5px solid #bca16d;outline:3px solid #111;padding:10px;text-align:center;box-shadow:inset 0 0 0 3px #fff0c9;margin-bottom:16px}.totalBox label{font-weight:1000;font-size:clamp(13px,3.3vw,20px);letter-spacing:2px}.balance{display:block;width:min(100%,340px);margin:7px auto 0;background:#145c34;color:#fff0cc;border:4px solid #27291d;outline:2px solid #10130f;font-size:clamp(27px,7vw,43px);font-weight:1000;padding:6px 3px;overflow-wrap:anywhere;text-shadow:2px 2px #163c22}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{min-width:0;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);border:5px solid #c3a36b;outline:3px solid #10100d;box-shadow:inset 0 0 0 2px #fff0c9}.head{background:linear-gradient(#237c3c,#15562d);color:#fff0cc;text-align:center;padding:12px 3px;border-bottom:4px solid #6d4a25;text-shadow:2px 2px #12391e}.out .head{background:linear-gradient(#b13227,#8a211b);text-shadow:2px 2px #50140f}.head h2{font-size:clamp(12px,3.1vw,20px);margin:0;letter-spacing:1px}.rows{padding:5px 7px;flex:1}.tx{display:grid;gap:5px;padding:10px 2px;border-bottom:3px solid #dfc18a}.txName{font-size:clamp(10px,2.7vw,14px);font-weight:1000;overflow-wrap:anywhere}.txBottom{display:flex;align-items:center;justify-content:space-between;gap:3px}.amount{font-size:clamp(10px,2.8vw,15px);font-weight:1000;white-space:nowrap}.income .amount{color:#155c31}.out .amount{color:#94251e}.mini{border:2px solid #5c221b;background:#b32d25;color:#fff0cc;font-weight:1000;padding:4px 5px;font-size:10px}.add{margin:9px 7px 11px;padding:12px 3px;border:4px solid #174d2b;background:var(--green2);color:#fff0cc;font-weight:1000;font-size:clamp(10px,2.6vw,14px);text-shadow:2px 2px #164321;box-shadow:0 3px #684520}.out .add{background:var(--red2);border-color:#70211b;text-shadow:2px 2px #591712}.panelTotal{padding:11px 7px;background:#e6c88d;border-top:4px solid #b18e55;text-align:center}.panelTotal label{display:block;font-size:clamp(9px,2.2vw,13px);font-weight:1000;letter-spacing:1px}.panelTotal strong{display:block;margin:7px auto 0;padding:7px 2px;background:var(--green);color:#fff0cc;border:3px solid #1e2618;font-size:clamp(16px,4.5vw,26px);overflow-wrap:anywhere}.out .panelTotal strong{background:var(--red)}
.history{margin-top:20px;background:#292d2d;border:3px solid #77705d;padding:12px}.history h2{margin:0 0 10px;color:var(--paper);font-size:16px;letter-spacing:1px}.historyIntro{font-size:10px;color:#c8c0aa;margin:0 0 10px}.historyItem{background:#eee0bb;color:#241b12;margin:8px 0;border:3px solid #bca16d}.historyItem summary{cursor:pointer;list-style:none;padding:10px;font-weight:1000;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.historyItem summary::-webkit-details-marker{display:none}.historyItem .details{padding:0 10px 10px;font-size:11px}.historyItem .details div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-top:1px solid #d5bd8d}.pos{color:#176638}.neg{color:#97271f}.empty{font-size:11px;color:#7b6540;padding:10px 2px}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px}.bottom button{padding:14px 3px;background:#414349;color:#fff0cc;border:4px solid #77787a;outline:2px solid #101010;font-weight:1000;font-size:clamp(10px,2.7vw,14px);box-shadow:0 4px #08090a}
.modal{position:fixed;inset:0;background:#000c;z-index:10;display:none;align-items:center;justify-content:center;padding:15px}.modal.open{display:flex}.dialog{width:min(100%,410px);max-height:90vh;overflow:auto;background:var(--paper);color:var(--ink);border:5px solid #bca16d;outline:3px solid #111;padding:17px}.dialog h2{margin:0 0 14px;color:#145c34;font-size:19px}.field{margin:11px 0}.field label{display:block;font-weight:1000;font-size:11px;margin-bottom:5px}.field input,.field select{width:100%;padding:11px;background:#fff0c9;color:#241b12;border:2px solid #b28e52;border-radius:0}.buttons{display:flex;gap:8px;margin-top:15px}.buttons button{flex:1;padding:11px;border:3px solid #694522;background:#176638;color:#fff0cc;font-weight:1000}.buttons .cancel{background:#55534a}.error{min-height:15px;color:#a12d23;font-size:10px;margin-top:5px}.note{text-align:center;color:#aeb6ae;font-size:9px;line-height:1.5;margin:18px 0 0}.sample{display:inline-block;background:#f3dca8;color:#241b12;padding:4px 7px;font-size:9px;font-weight:bold;margin:0 auto 10px;border:2px solid #bca16d}
@media(max-width:480px){body{padding:7px}.title{font-size:clamp(42px,14vw,64px);letter-spacing:clamp(2px,1vw,5px);line-height:.95;transform:translateY(7px) scaleX(1.02);-webkit-text-stroke:1.5px #0d2516;text-shadow:3px 0 #0d2516,-3px 0 #0d2516,0 3px #0d2516,0 -3px #0d2516,3px 3px #0d2516,-3px -3px #0d2516,3px -3px #0d2516,-3px 3px #0d2516,6px 6px 0 #0b2517,8px 8px 0 #092b19;margin-bottom:12px}.settings{gap:8px;padding:9px}.columns{gap:8px}.panel{border-width:3px}.rows{padding:3px}.tx{padding:8px 1px}.add{margin:7px 4px 9px}.panelTotal{padding:8px 4px}.bottom{gap:5px}.bottom button{font-size:9px;padding:11px 2px}.mini{font-size:9px;padding:4px 3px}}

/* Subtle softened corners while keeping the pixel-art look */
.settings,
.totalBox,
.panel,
.dialog {
  border-radius: 5px;
}
.settings select,
.settings input,
.field input,
.field select {
  border-radius: 3px;
}
.tx {
  border-radius: 2px;
}


/* More rounded corners, retaining the chunky retro borders */
.settings,
.totalBox,
.panel,
.dialog {
  border-radius: 12px;
  overflow: hidden;
}
.settings select,
.settings input,
.field input,
.field select {
  border-radius: 8px;
}
.tx {
  border-radius: 6px;
}

const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat("en-IE",{style:"currency",currency:"EUR"}).format(n).replace(/\u00a0/g," "), esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.income)&&Array.isArray(x.expense))return {...seed,...x}}catch(e){}return JSON.parse(JSON.stringify(seed))}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){notify("Storage unavailable. Export a CSV backup.");return false}}
function notify(s){const n=document.createElement("div");n.textContent=s;n.style.cssText="position:fixed;left:50%;bottom:15px;transform:translateX(-50%);max-width:90vw;padding:10px;background:#161a1c;color:#fff0cc;border:3px solid #d9b570;z-index:20;font:12px monospace;text-align:center";document.body.append(n);setTimeout(()=>n.remove(),2400)}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d,12)}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function addMonthsClamped(date,n){const y=date.getFullYear(),m=date.getMonth()+n,day=date.getDate(),last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last),12)}
function cycleFor(date){const anchor=parse(state.anchor||seed.anchor),freq=state.frequency||"monthly";let start,end;
 if(freq==="weekly"||freq==="fortnightly"){const days=freq==="weekly"?7:14;const diff=Math.floor((date-anchor)/86400000);const index=Math.floor(diff/days);start=new Date(anchor);start.setDate(anchor.getDate()+index*days);end=new Date(start);end.setDate(start.getDate()+days-1)}
 else {let months=(date.getFullYear()-anchor.getFullYear())*12+(date.getMonth()-anchor.getMonth());let startCandidate=addMonthsClamped(anchor,months);if(date<startCandidate){months--;startCandidate=addMonthsClamped(anchor,months)}start=startCandidate;end=new Date(addMonthsClamped(anchor,months+1));end.setDate(end.getDate()-1)}
 return {start:iso(start),end:iso(end),startDate:start,endDate:end};
}
const current=()=>cycleFor(new Date());
function inCycle(x,c){return x.date>=c.start&&x.date<=c.end}
function sums(arr){return arr.reduce((s,x)=>s+Number(x.amount||0),0)}
function allEntries(){return [...state.income.map(x=>({...x,kind:"income"})),...state.expense.map(x=>({...x,kind:"expense"}))]}
function label(s){return parse(s).toLocaleDateString("en-IE",{day:"2-digit",month:"short",year:"numeric"})}
function draw(k,c){const host=$(k==="income"?"incomeRows":"expenseRows"),arr=state[k].filter(x=>inCycle(x,c)).sort((a,b)=>a.date.localeCompare(b.date));if(!arr.length){host.innerHTML='<p class="empty">No entries in this cycle yet.</p>';return}host.innerHTML=arr.map(x=>`<article class="tx"><div class="txName">${esc(x.name)}</div><div class="txBottom"><div class="amount">${k==="income"?"+":"−"}${money(Number(x.amount))}</div><div style="display:flex;gap:3px"><button class="mini" data-edit="${esc(x.id)}" data-kind="${k}">EDIT</button><button class="mini" data-delete="${esc(x.id)}" data-kind="${k}" aria-label="Delete ${esc(x.name)}">DEL</button></div></div><div style="font-size:9px;color:#735a37">${label(x.date)}${x.category&&x.category!=="General"?" · "+esc(x.category):""}</div></article>`).join("")}
function history(){const c=current(),days=state.frequency==="weekly"?7:state.frequency==="fortnightly"?14:null;let periods=[];let cursor=parse(c.start);for(let i=0;i<12;i++){let end;if(state.frequency==="monthly"){end=addMonthsClamped(parse(state.anchor),0); // replaced below by next anchored cycle
 let idx=(cursor.getFullYear()-parse(state.anchor).getFullYear())*12+cursor.getMonth()-parse(state.anchor).getMonth();end=addMonthsClamped(parse(state.anchor),idx+1);end.setDate(end.getDate()-1)
 }else{end=new Date(cursor);end.setDate(end.getDate()+days-1)}
 const s=iso(cursor),e=iso(end);if(s>=c.start)break;const ins=state.income.filter(x=>x.date>=s&&x.date<=e),outs=state.expense.filter(x=>x.date>=s&&x.date<=e);periods.push({s,e,inc:sums(ins),out:sums(outs),ins,outs});cursor=new Date(end);cursor.setDate(cursor.getDate()+1)}
 const host=$("historyRows");if(!periods.length){host.innerHTML='<div class="empty" style="color:#e5d8b8">No previous budgets yet. Your previous balances will appear here as periods finish.</div>';return}
 host.innerHTML=periods.reverse().map(p=>`<details class="historyItem"><summary><span>${label(p.s)} – ${label(p.e)}</span><span class="${p.inc-p.out>=0?"pos":"neg"}">${money(p.inc-p.out)}</span></summary><div class="details"><div><b>IN</b><b class="pos">${money(p.inc)}</b></div><div><b>OUT</b><b class="neg">${money(p.out)}</b></div>${[...p.ins.map(x=>({...x,k:"IN"})),...p.outs.map(x=>({...x,k:"OUT"}))].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<div><span>${x.k} · ${esc(x.name)} <small>(${label(x.date)})</small></span><b>${money(Number(x.amount))}</b></div>`).join("")||'<p>No transactions recorded in this cycle.</p>'}</div></details>`).join("")}
function render(){const c=current(),inc=state.income.filter(x=>inCycle(x,c)),out=state.expense.filter(x=>inCycle(x,c)),i=sums(inc),o=sums(out);$("frequency").value=state.frequency;$("startDate").value=state.anchor;$("cycleLabel").textContent=`${state.frequency.toUpperCase()} · ${label(c.start)} TO ${label(c.end)}`;$("incomeTotal").textContent=money(i);$("expenseTotal").textContent=money(o);$("balance").textContent=money(i-o);draw("income",c);draw("expense",c);history()}
function open(k,x){kind=k;editId=x?.id||null;$("formTitle").textContent=(editId?"EDIT ":"ADD ")+(k==="income"?"INCOME":"EXPENSE");$("name").value=x?.name||"";$("amount").value=x?.amount??"";$("date").value=x?.date||iso(new Date());$("category").value=x?.category||"General";$("error").textContent="";$("submit").textContent=editId?"SAVE CHANGES":"SAVE ENTRY";$("modal").classList.add("open");$("name").focus()}
function close(){$("modal").classList.remove("open");editId=null}
function exportCSV(){const rows=[["Type","Name","Date","Category","Amount EUR"]];for(const k of ["income","expense"])for(const x of state[k])rows.push([k,x.name,x.date,x.category,Number(x.amount).toFixed(2)]);const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n"),url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="budget-euro-alpha.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$("frequency").onchange=e=>{state.frequency=e.target.value;persist();render();notify("Budget period updated. Transactions remain saved.")};
$("startDate").onchange=e=>{if(!e.target.value){e.target.value=state.anchor;return}state.anchor=e.target.value;persist();render();notify("Start date updated. Previous balances recalculated from saved transactions.")};
$("addIncome").onclick=()=>open("income");$("addExpense").onclick=()=>open("expense");$("cancel").onclick=close;$("modal").onclick=e=>{if(e.target===$("modal"))close()};document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("form").onsubmit=e=>{e.preventDefault();const x={name:$("name").value.trim(),amount:Number($("amount").value),date:$("date").value,category:$("category").value};if(!x.name||!x.date||!Number.isFinite(x.amount)||x.amount<=0){$("error").textContent="Enter a name, date and amount greater than zero.";return}if(editId){const i=state[kind].findIndex(y=>y.id===editId);if(i>=0)state[kind][i]={...state[kind][i],...x}}else state[kind].push({id:globalThis.crypto?.randomUUID?.()||String(Date.now()+Math.random()),...x});persist();render();close();notify("Entry saved.")};
document.addEventListener("click",e=>{const ed=e.target.closest("[data-edit]"),del=e.target.closest("[data-delete]");if(ed){const k=ed.dataset.kind,x=state[k].find(y=>y.id===ed.dataset.edit);if(x)open(k,x)}if(del){const k=del.dataset.kind,x=state[k].find(y=>y.id===del.dataset.delete);if(x&&confirm("Delete "+x.name+"?")){state[k]=state[k].filter(y=>y.id!==x.id);persist();render();notify("Entry deleted.")}}});
$("save").onclick=()=>{persist();notify("Saved in this browser.")};$("export").onclick=exportCSV;$("reset").onclick=()=>{if(confirm("Restore the sample data and default monthly cycle?")){state=JSON.parse(JSON.stringify(seed));persist();render();notify("Sample data restored.")}};
render();persist();
})();
</script>

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
